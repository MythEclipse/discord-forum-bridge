name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: discord-forum-bridge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Bridge checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The version comes from the packageManager field when present, so the
      # action and the lockfile cannot drift apart. This repo currently has no
      # pin, so npm is used and the lockfile is the only constraint.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      # smoke-state-guard.js runs FIRST on purpose. It asserts that the scripts
      # which write state.json refuse to run without BRIDGE_DATA_DIR. On
      # 2026-10-17 a direct `node scripts/smoke-forum.js` (bypassing the npm
      # wrapper that sets that var) wrote a test fixture into the LIVE state file;
      # because the run then failed an assertion, its cleanup never ran, every
      # cursor was wiped, and the bridge re-mirrored 35 posts into Discord
      # (journal: {"fetched":20,"skipped":0,"mirrored":35}). A guard inside the
      # file - not only in the wrapper - is what prevents a repeat, and this
      # step is what keeps those guards honest.
      - name: State guard checks
        run: npm run check:guard

      - name: Syntax check every JS file
        run: |
          set -euo pipefail
          count=0
          for f in $(find src scripts test -name '*.js'); do
            node --check "$f"
            count=$((count + 1))
          done
          echo "checked $count JS files"

      # check-nodebb-client.js boots a stub NodeBB on 127.0.0.1 and asserts the
      # request shapes the bridge depends on: the multipart field name, auth
      # mode handling, error translation. It needs no forum and no secrets, so
      # CI can run the same assertions that run locally.
      - name: NodeBB client checks
        run: npm run check:client

      # The forum-mode suite runs against a temporary BRIDGE_DATA_DIR so it
      # never touches the real cursor state. It exercises markdown conversion,
      # rank boundaries and anti-echo logic.
      - name: Forum mode checks
        run: npm run check:forum

      # smoke-media.js pins the four render shapes an attachment can take.
      # The <video>/<audio> assertions are the tripwire for a forum-side
      # setting the bridge cannot see: nodebb-plugin-markdown escapes raw
      # HTML into visible text unless settings:markdown carries
      # {"html":"on"} (the value MUST be the string 'on'). Reverting that on
      # the forum would silently turn every mirrored video into literal
      # "<video controls ...>" text, and these assertions are what catch it.
      - name: Media render checks
        run: npm run check:media

      # smoke-thread-intro.js pins the three bugs that produced one visibly
      # broken Discord message from a real thread: `topic.timestamp` is in
      # MILLISECONDS (multiplying by 1000 rendered year +058750), the v3 topic
      # object has NO username field at all (so every intro read `_unknown`),
      # and the link used the loopback API url which no Discord reader can open.
      # The loopback check in config.publicForumUrl is the structural guard;
      # these assertions are what keep it honest.
      - name: Thread intro checks
        run: npm run check:intro

      # smoke-notice.js pins the fix for the "Diskusi ini sekarang ada di forum"
      # notification. That message looked twice as long as it was because Discord
      # unfurled the forum link inside it: NodeBB serves a topic's first post as
      # BOTH og:title and og:description, so the reader saw the sentence twice in
      # one card. The suite asserts the notice is off by default, that no mode can
      # reintroduce the duplicate (embeds are suppressed in every posted mode),
      # and that the thread starter suppresses its own unfurl. It also asserts the
      # call sites, because a correct policy module that nothing imports would
      # pass every behavioural test and still ship the bug.
      - name: Notice and embed-suppression checks
        run: npm run check:notice

      # check-nodebb-url.js rejects a NODEBB_URL that points at a retired
      # docker-bridge address (10.0.x.x) or the retired /usr/src/app container
      # path. On 2026-10-16 that exact misconfiguration kept the unit
      # "active (running)" while every poll died with ETIMEDOUT, so the mirror
      # was silently broken and systemctl reported success. It skips cleanly
      # when the checkout has no .env, and it listens-checked the loopback
      # target when one is configured.
      - name: NodeBB URL guard
        run: npm run check:url

      # The vendored plugin-bridge-upload/ copy drifted badly enough to be
      # actively misleading: it still resolved the app root to the Docker path,
      # so anyone reading this repo would copy code that cannot work on a native
      # install. This check runs the drift assertions directly.
      - name: Vendored plugin and forum-origin checks
        run: node test/nodebb-client.test.js
